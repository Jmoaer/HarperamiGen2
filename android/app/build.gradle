plugins {
    id 'com.android.application'
}

def keystoreFile = rootProject.file('release/keystore.properties')
def keystore = new Properties()
if (keystoreFile.exists()) {
    keystoreFile.withInputStream { keystore.load(it) }
}

android {
    namespace 'com.harperami.gen2'
    compileSdk 36

    defaultConfig {
        applicationId 'com.harperami.gen2'
        minSdk 29
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
        resourceConfigurations += ['en']
    }

    signingConfigs {
        release {
            if (keystoreFile.exists()) {
                storeFile rootProject.file(keystore['storeFile'])
                storePassword keystore['storePassword']
                keyAlias keystore['keyAlias']
                keyPassword keystore['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    bundle {
        language { enableSplit = false }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    // Keeps the Kotlin stdlib versions that AndroidX pulls in aligned
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
